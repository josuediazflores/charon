  <script type="application/json" id="content">{"docs":{"report/chicago":{"title":"Two Chicago internships to review for summer 2027","html":"\u003cp>I added two summer software roles to \u003ca href=\"#note/delivered\">your Chicago internship list\u003c/a>. I’d open \u003cstrong>Maple Studio\u003c/strong> first. Its mobile engineering internship closes Friday, November 27. The second employer, \u003cstrong>Lakefront Labs\u003c/strong>, hasn’t published a deadline.\u003c/p>\n\u003cp>Both employers were accepting applications when I checked this morning. I saved the posting links with each entry. Once you share the path to your master résumé, I can use it to tailor a Word draft for each role.\u003c/p>\n\u003cfigure>\n\u003cimg data-illustration width=\"1440\" height=\"576\" alt=\"The Chicago lakefront at first light. Illustration.\" />\n\u003cfigcaption aria-hidden=\"true\">The Chicago lakefront at first light. Illustration.\u003c/figcaption>\n\u003c/figure>\n\u003ch2 id=\"which-role-to-look-at-first\">Which role to look at first\u003c/h2>\n\u003cp>\u003ca href=\"#note/maple\">Maple Studio’s Mobile Engineering Intern posting\u003c/a> gives us a date to work back from. I checked the employer’s application at 6:10 a.m. Pacific and recorded the closing date alongside the link. That makes Maple the first one I’d review if you only have a few minutes today.\u003c/p>\n\u003cp>\u003ca href=\"#note/lakefront\">Lakefront Labs’ Software Engineering Intern posting\u003c/a> also lists Chicago and summer 2027. Its application was open at 6:15 a.m. Pacific. The posting gives no closing date, so I’ve left that field open on your list.\u003c/p>\n\u003ch2 id=\"what-i-did-overnight\">What I did overnight\u003c/h2>\n\u003col type=\"1\">\n\u003cli>\u003cstrong>Checked for an existing list.\u003c/strong> At 6:05 a.m. I looked in your Career project for a note covering Chicago internships for summer 2027.\u003c/li>\n\u003cli>\u003cstrong>Created the list with Maple Studio.\u003c/strong> This was the first search for that place and term. I saved the employer’s posting ID, its application and its deadline.\u003c/li>\n\u003cli>\u003cstrong>Added Lakefront Labs to the same note.\u003c/strong> I checked its posting ID and location before adding the second entry. Both entries are marked \u003cem>To review\u003c/em>.\u003c/li>\n\u003cli>\u003cstrong>Saved the research at 6:18 a.m.\u003c/strong> I paused the drafting step when I couldn’t find your master résumé. Both openings are available to review now.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"where-to-pick-this-up\">Where to pick this up\u003c/h2>\n\u003cp>\u003ca href=\"#note/delivered\">Open the list as delivered\u003c/a> to see exactly what I left this morning. \u003ca href=\"#note/current\">Open your current list\u003c/a> to see any notes you’ve added since. When you share the path to your master Word document, I can make a separate tailored .docx for each role.\u003c/p>\n","raw":"# Two Chicago internships to review for summer 2027\n\nI added two summer software roles to [your Chicago internship list](revisions/chicago-internships/2.md). I’d open **Maple Studio** first. Its mobile engineering internship closes Friday, November 27. The second employer, **Lakefront Labs**, hasn’t published a deadline.\n\nBoth employers were accepting applications when I checked this morning. I saved the posting links with each entry. Once you share the path to your master résumé, I can use it to tailor a Word draft for each role.\n\n![The Chicago lakefront at first light. Illustration.](../assets/lakefront.jpg)\n\n## Which role to look at first\n\n[Maple Studio’s Mobile Engineering Intern posting](assignments/chicago-internships/runs/2026-11-24/sources.md#maple-studio) gives us a date to work back from. I checked the employer’s application at 6:10 a.m. Pacific and recorded the closing date alongside the link. That makes Maple the first one I’d review if you only have a few minutes today.\n\n[Lakefront Labs’ Software Engineering Intern posting](assignments/chicago-internships/runs/2026-11-24/sources.md#lakefront-labs) also lists Chicago and summer 2027. Its application was open at 6:15 a.m. Pacific. The posting gives no closing date, so I’ve left that field open on your list.\n\n## What I did overnight\n\n1. **Checked for an existing list.** At 6:05 a.m. I looked in your Career project for a note covering Chicago internships for summer 2027.\n2. **Created the list with Maple Studio.** This was the first search for that place and term. I saved the employer’s posting ID, its application and its deadline.\n3. **Added Lakefront Labs to the same note.** I checked its posting ID and location before adding the second entry. Both entries are marked *To review*.\n4. **Saved the research at 6:18 a.m.** I paused the drafting step when I couldn’t find your master résumé. Both openings are available to review now.\n\n## Where to pick this up\n\n[Open the list as delivered](revisions/chicago-internships/2.md) to see exactly what I left this morning. [Open your current list](projects/career/Summer%202027%20internships%20in%20Chicago.md) to see any notes you’ve added since. When you share the path to your master Word document, I can make a separate tailored .docx for each role.\n","minutes":2,"date":"November 24, 2026","stamp":"Updated 6:18 a.m. PT","short":"Internship search","back":"tasks"},"report/microphone":{"title":"Where to put the microphone for your next call","html":"\u003cp>I’d put the microphone on the \u003cstrong>desk stand\u003c/strong> for your next call. In your \u003ca href=\"#note/stand\">stand trial\u003c/a>, typing interrupted one of six clips. In the \u003ca href=\"#note/keyboard\">keyboard-side trial\u003c/a>, it interrupted four of six. Both trials used the same desk and keyboard.\u003c/p>\n\u003cp>That gives you a place to start tomorrow. Twelve short clips can’t tell us how the stand will sound when you’re talking and typing for several minutes at a stretch. A longer call would be a good follow-up.\u003c/p>\n\u003ch2 id=\"what-i-compared\">What I compared\u003c/h2>\n\u003cp>I compared the number of clips where the trial notes said typing interrupted the voice. Each clip counts once, even if several keystrokes came through. That gives both positions the same six chances to pick up an interruption.\u003c/p>\n\u003ch2 id=\"how-i-reached-the-recommendation\">How I reached the recommendation\u003c/h2>\n\u003col type=\"1\">\n\u003cli>\u003cstrong>Opened the two trial notes\u003c/strong> in your Voice project and checked how many clips each contained.\u003c/li>\n\u003cli>\u003cstrong>Compared the interruptions.\u003c/strong> The stand had one interrupted clip and five clear clips. The keyboard-side position had four interrupted clips and two clear clips.\u003c/li>\n\u003cli>\u003cstrong>Saved the finding with both sources.\u003c/strong> For the next test, use the stand on a longer call and jot down any moment when typing makes your voice hard to follow.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"trial-notes\">Trial notes\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#note/stand\">Desk stand trial\u003c/a> · Six clips, one interruption.\u003c/li>\n\u003cli>\u003ca href=\"#note/keyboard\">Keyboard-side trial\u003c/a> · Six clips, four interruptions.\u003c/li>\n\u003c/ul>\n","raw":"# Where to put the microphone for your next call\n\nI’d put the microphone on the **desk stand** for your next call. In your [stand trial](desk-stand.md), typing interrupted one of six clips. In the [keyboard-side trial](keyboard-side.md), it interrupted four of six. Both trials used the same desk and keyboard.\n\nThat gives you a place to start tomorrow. Twelve short clips can’t tell us how the stand will sound when you’re talking and typing for several minutes at a stretch. A longer call would be a good follow-up.\n\n## What I compared\n\nI compared the number of clips where the trial notes said typing interrupted the voice. Each clip counts once, even if several keystrokes came through. That gives both positions the same six chances to pick up an interruption.\n\n## How I reached the recommendation\n\n1. **Opened the two trial notes** in your Voice project and checked how many clips each contained.\n2. **Compared the interruptions.** The stand had one interrupted clip and five clear clips. The keyboard-side position had four interrupted clips and two clear clips.\n3. **Saved the finding with both sources.** For the next test, use the stand on a longer call and jot down any moment when typing makes your voice hard to follow.\n\n## Trial notes\n\n- [Desk stand trial](desk-stand.md) · Six clips, one interruption.\n- [Keyboard-side trial](keyboard-side.md) · Six clips, four interruptions.\n","minutes":2,"date":"November 23, 2026","stamp":"","short":"Microphone test","back":"tasks"},"note/delivered":{"title":"Summer 2027 internships in Chicago","html":"\u003cp>\u003cem>Fictional example. This is the running list in the Career project.\u003c/em>\u003c/p>\n\u003ch2 id=\"open-roles\">Open roles\u003c/h2>\n\u003ch3 id=\"maple-studio-mobile-engineering-intern\">Maple Studio | Mobile Engineering Intern\u003c/h3>\n\u003cp>Chicago · Summer 2027 · Open when checked November 24 at 6:10 a.m. Pacific.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Apply by\u003c/strong> Friday, November 27, 2026.\u003c/li>\n\u003cli>\u003cstrong>Application\u003c/strong> \u003ca href=\"#note/maple\">Maple Studio posting, MS-127\u003c/a>.\u003c/li>\n\u003cli>\u003cstrong>My application status\u003c/strong> To review.\u003c/li>\n\u003cli>\u003cstrong>My notes\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"lakefront-labs-software-engineering-intern\">Lakefront Labs | Software Engineering Intern\u003c/h3>\n\u003cp>Chicago · Summer 2027 · Open when checked November 24 at 6:15 a.m. Pacific.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Apply by\u003c/strong> The posting gives no deadline.\u003c/li>\n\u003cli>\u003cstrong>Application\u003c/strong> \u003ca href=\"#note/lakefront\">Lakefront Labs posting, LL-208\u003c/a>.\u003c/li>\n\u003cli>\u003cstrong>My application status\u003c/strong> To review.\u003c/li>\n\u003cli>\u003cstrong>My notes\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"related-work\">Related work\u003c/h2>\n\u003cp>\u003ca href=\"#report/chicago\">November 24 internship search\u003c/a>\u003c/p>\n","raw":"---\nid: chicago-summer-internships-2027\ntype: project-note\nproject: career\nrevision: 2\nupdated: 2026-11-24T06:15:00-08:00\n---\n\n# Summer 2027 internships in Chicago\n\n*Fictional example. This is the running list in the Career project.*\n\n## Open roles\n\n### Maple Studio | Mobile Engineering Intern\n\nChicago · Summer 2027 · Open when checked November 24 at 6:10 a.m. Pacific.\n\n- **Apply by** Friday, November 27, 2026.\n- **Application** [Maple Studio posting, MS-127](../../assignments/chicago-internships/runs/2026-11-24/sources.md#maple-studio).\n- **My application status** To review.\n- **My notes**\n\n### Lakefront Labs | Software Engineering Intern\n\nChicago · Summer 2027 · Open when checked November 24 at 6:15 a.m. Pacific.\n\n- **Apply by** The posting gives no deadline.\n- **Application** [Lakefront Labs posting, LL-208](../../assignments/chicago-internships/runs/2026-11-24/sources.md#lakefront-labs).\n- **My application status** To review.\n- **My notes**\n\n## Related work\n\n[November 24 internship search](../../assignments/chicago-internships/runs/2026-11-24/summary.md)\n","minutes":1,"date":"Career project","stamp":"Revision 2 · As delivered","short":"Delivered list","back":"report/chicago"},"note/current":{"title":"Summer 2027 internships in Chicago","html":"\u003cp>\u003cem>Fictional example. This is the running list in the Career project.\u003c/em>\u003c/p>\n\u003ch2 id=\"open-roles\">Open roles\u003c/h2>\n\u003ch3 id=\"maple-studio-mobile-engineering-intern\">Maple Studio | Mobile Engineering Intern\u003c/h3>\n\u003cp>Chicago · Summer 2027 · Open when checked November 24 at 6:10 a.m. Pacif
